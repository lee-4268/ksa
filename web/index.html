<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="무선국 검사 관리 시스템">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="무선국 검사 관리">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>무선국 검사 관리</title>
  <link rel="manifest" href="manifest.json">

  <!-- 카카오맵 API (웹용) - 비동기 로딩으로 성능 개선, services 라이브러리 포함 -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6f4fbe76fbb53a0ba573d755b1a3adde&libraries=services&autoload=false"></script>
  <script>
    // 카카오맵 SDK 수동 로드 (비동기) - 로드 완료 후 콜백
    window.kakaoMapsLoaded = false;
    window.kakaoMapsLoadError = null;

    function initKakaoMaps() {
      if (typeof kakao !== 'undefined' && kakao.maps && typeof kakao.maps.load === 'function') {
        kakao.maps.load(function() {
          console.log('카카오맵 SDK 로드 완료');
          window.kakaoMapsLoaded = true;
        });
      } else {
        // SDK 스크립트가 아직 로드되지 않은 경우 재시도
        console.log('카카오맵 SDK 대기 중...');
        setTimeout(initKakaoMaps, 100);
      }
    }

    // 스크립트 로드 후 초기화
    initKakaoMaps();

    // Dart에서 호출할 역지오코딩 함수
    // 결과를 JS에서 직접 파싱하여 지역명 문자열만 콜백으로 전달
    function _callKakaoGeocoderFromDart(lat, lon, callback) {
      console.log('_callKakaoGeocoderFromDart 호출됨: lat=' + lat + ', lon=' + lon);

      if (!window.kakaoMapsLoaded) {
        console.log('카카오맵이 아직 로드되지 않음, 1초 후 재시도');
        setTimeout(function() {
          _callKakaoGeocoderFromDart(lat, lon, callback);
        }, 1000);
        return;
      }

      if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) {
        console.log('카카오맵 서비스 객체 없음');
        callback(null);
        return;
      }

      try {
        var geocoder = new kakao.maps.services.Geocoder();
        console.log('Geocoder 생성 완료, coord2RegionCode 호출');

        geocoder.coord2RegionCode(lon, lat, function(result, status) {
          console.log('coord2RegionCode 콜백, status:', status);

          // status가 kakao.maps.services.Status.OK와 같은지 확인
          if (status === kakao.maps.services.Status.OK && result && result.length > 0) {
            console.log('역지오코딩 성공, 결과:', result);

            // "시" 단위까지만 추출
            var region1 = result[0].region_1depth_name || ''; // 시/도 (서울특별시, 경기도 등)
            var region2 = result[0].region_2depth_name || ''; // 시/군/구 (강서구, 안양시 만안구 등)
            var locationName = '';

            // 특별시/광역시인 경우: "서울시", "인천시", "부산시" 등
            if (region1.indexOf('특별시') !== -1 || region1.indexOf('광역시') !== -1) {
              locationName = region1.replace('특별시', '시').replace('광역시', '시').replace('특별자치시', '시');
            } else {
              // 도 단위 (경기도, 충청남도 등): region_2depth_name에서 "시" 단위 추출
              // region2 예: "안양시 만안구", "수원시 팔달구", "부천시" 등
              if (region2) {
                var siMatch = region2.match(/^(\S+시)/);
                if (siMatch) {
                  locationName = siMatch[1]; // "안양시", "수원시", "부천시" 등
                } else {
                  // "시"가 없으면 region2 그대로 (군/구 단위)
                  locationName = region2.split(' ')[0];
                }
              } else {
                locationName = region1;
              }
            }

            console.log('추출된 지역명:', locationName);
            callback(locationName);
          } else {
            console.log('역지오코딩 실패 또는 결과 없음');
            callback(null);
          }
        });
      } catch (e) {
        console.error('카카오 Geocoder 호출 오류:', e);
        callback(null);
      }
    }
  </script>
  <style>
    /* 로딩 화면 스타일 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-icon {
      width: 80px;
      height: 80px;
      background: rgba(229, 57, 53, 0.1);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-icon svg {
      width: 48px;
      height: 48px;
      fill: #E53935;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .loading-title {
      color: #212121;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .loading-subtitle {
      color: #757575;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin-bottom: 40px;
    }

    /* 세련된 로딩 스피너 */
    .loading-spinner {
      display: flex;
      gap: 8px;
    }

    .loading-spinner span {
      width: 10px;
      height: 10px;
      background: #E53935;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .loading-spinner span:nth-child(1) { animation-delay: 0s; }
    .loading-spinner span:nth-child(2) { animation-delay: 0.2s; }
    .loading-spinner span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }
      40% {
        transform: translateY(-12px);
        opacity: 1;
      }
    }

    /* 진행 바 */
    .loading-progress {
      width: 200px;
      height: 4px;
      background: rgba(229, 57, 53, 0.15);
      border-radius: 2px;
      margin-top: 32px;
      overflow: hidden;
    }

    .loading-progress-bar {
      height: 100%;
      background: #E53935;
      border-radius: 2px;
      width: 0%;
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <!-- 커스텀 로딩 화면 -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C13.1 2 14 2.9 14 4V6.1C17.4 6.6 20 9.5 20 13V18H21C21.6 18 22 18.4 22 19S21.6 20 21 20H3C2.4 20 2 19.6 2 19S2.4 18 3 18H4V13C4 9.5 6.6 6.6 10 6.1V4C10 2.9 10.9 2 12 2ZM12 8C8.7 8 6 10.7 6 14V18H18V14C18 10.7 15.3 8 12 8ZM12 4.5C11.7 4.5 11.5 4.7 11.5 5V6H12.5V5C12.5 4.7 12.3 4.5 12 4.5ZM7.3 3.1C7.1 3.4 7.2 3.8 7.5 4L9.2 5.1C9.5 5.3 9.9 5.2 10.1 4.9C10.3 4.6 10.2 4.2 9.9 4L8.2 2.9C7.9 2.7 7.5 2.8 7.3 3.1ZM16.7 3.1C16.5 2.8 16.1 2.7 15.8 2.9L14.1 4C13.8 4.2 13.7 4.6 13.9 4.9C14.1 5.2 14.5 5.3 14.8 5.1L16.5 4C16.8 3.8 16.9 3.4 16.7 3.1Z"/>
      </svg>
    </div>
    <div class="loading-title">무선국 관리 시스템</div>
    <div class="loading-subtitle">잠시만 기다려주세요</div>
    <div class="loading-spinner">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>

  <!-- SheetJS (xlsx.js) - Excel .xls/.xlsx read/write -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- JSZip - ZIP extraction in browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- DS 파일 병합 기능 -->
  <script src="ds_merge.js"></script>
  <!-- DS 데이터 업로드 기능 -->
  <script src="ds_upload.js"></script>
  <script src="ds_export.js"></script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 앱 로드 완료 시 로딩 화면 페이드 아웃
    window.addEventListener('flutter-first-frame', function() {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(function() {
          loadingScreen.remove();
        }, 500);
      }
    });
  </script>
</body>
</html>
