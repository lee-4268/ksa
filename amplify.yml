version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf flutter && git clone https://github.com/flutter/flutter.git -b stable --depth 1
        - export PATH="$PATH:`pwd`/flutter/bin"
        - flutter precache --web
        - flutter pub get
    build:
      commands:
        - flutter build web --no-tree-shake-icons --dart-define=KAKAO_JS_KEY=$KAKAO_JS_KEY --dart-define=KAKAO_REST_KEY=$KAKAO_REST_KEY --dart-define=KAKAO_NATIVE_KEY=$KAKAO_NATIVE_KEY --dart-define=KMA_SERVICE_KEY=$KMA_SERVICE_KEY
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - flutter/**/*
      - .dart_tool/**/*
      - .pub-cache/**/*
