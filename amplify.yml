version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d "flutter" ]; then cd flutter && git config pull.rebase false && git pull && cd ..; else git clone https://github.com/flutter/flutter.git -b stable --depth 1; fi
        - export PATH="$PATH:`pwd`/flutter/bin"
        - flutter precache --web
        - flutter pub get
    build:
      commands:
        - flutter build web
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - flutter/**/*
      - .dart_tool/**/*
      - .pub-cache/**/*
