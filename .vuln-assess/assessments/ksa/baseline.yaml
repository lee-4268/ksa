suppressions:
  - id: sqli-b608-false-positive-2026-06
    kind: false-positive
    reason: >-
      Bandit B608 SQL injection 151건 전수 검증(5개 에이전트 병렬 + 적대적 핵심 케이스
      확인) 결과 진성 0건. 모든 finding 이 (a) IN 절 동적 플레이스홀더('?'*N), (b) WHERE/SET
      절을 상수 조건 문자열로 조립하고 값은 ? 파라미터 바인딩으로 분리, (c) 테이블/컬럼명은
      상수 튜플 또는 화이트리스트(_ALLOWED_SORT, ALLOWED_COLS 등) 검증된 식별자만 f-string
      보간하는 패턴. 사용자 입력이 SQL 문자열에 직접 삽입되는 경로 없음. B608 은 f-string +
      SQL 키워드 휴리스틱이라 올바른 파라미터화 코드에도 발화하는 advisory 오탐.
      검증 회차: 2026-06-18 스냅샷 기준. 상세 docs/rules/security.md 5차 점검.
    match:
      slug: sql-injection
    added: 2026-06-16
    expires: 2026-12-16
    by: tomega0701 (SAST 5차, false-positive 판정)
  - id: oscommand-b603-false-positive-2026-06
    kind: false-positive
    reason: >-
      Bandit B404/B603 os-command-injection 2건(inspection.py:1361 import subprocess,
      :1366 subprocess.Popen) 검증 결과 진성 0건. Popen 은 shell=False(기본) + 리스트
      인자 형태라 셸 메타문자 주입 불가. 실행 파일은 고정 inspection_worker.py(sys.executable),
      사용자 입력(s3Key/year/uploadedBy)은 worker 의 argv 로만 전달되고 worker 는 셸
      재실행(subprocess/os.system) 전무, year 는 int() 캐스팅. 엔드포인트에 admin/manager
      role 게이트(inspection.py:1354) 존재. CLAUDE.md 권장(shell=False/리스트 인자) 준수.
      검증 회차: 2026-06-18 스냅샷. 상세 docs/rules/security.md 5차 점검.
    match:
      slug: os-command-injection
    added: 2026-06-16
    expires: 2026-12-16
    by: tomega0701 (SAST 5차, false-positive 판정)
  - id: xxe-b314-b405-b406-false-positive-2026-06
    kind: false-positive
    reason: >-
      Bandit B314/B405/B406 XXE 22건(callname.py 12, inspection.py 8, hwp_generator.py 1)
      검증 결과 진성 0건. (1) 대부분 사용자 업로드 XLSX 의 내부 XML(workbook.xml/sharedStrings/
      worksheet)을 xml.etree.ElementTree 로 파싱 — 입력은 공격자 통제 가능하나, Python 표준
      xml.etree 는 **외부 엔티티(SYSTEM file://, http://)를 확장하지 않음**(실측: undefined
      entity ParseError 로 거부). 따라서 XXE 파일탈취/SSRF 경로 없음. 내부 엔티티만 확장하나
      iterparse 스트리밍이라 billion-laughs 영향도 제한적. (2) hwp_generator.py:11 은
      xml.sax.saxutils.escape — XML *생성* 시 출력 이스케이프 함수로 파싱 아님, XXE 무관.
      Bandit 룰은 보수적 advisory. 검증 회차 2026-06-18. 상세 docs/rules/security.md.
    match:
      slug: improper-input-validation
    added: 2026-06-16
    expires: 2026-12-16
    by: tomega0701 (SAST 5차, false-positive 판정)
